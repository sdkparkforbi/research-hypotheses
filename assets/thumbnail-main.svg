<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="50%" stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1"/>
      <stop offset="100%" stop-color="#fbc2eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- 배경 -->
  <rect width="1200" height="600" fill="url(#bg-main)"/>
  
  <!-- 배경 장식 원형들 -->
  <circle cx="100" cy="100" r="80" fill="white" opacity="0.05"/>
  <circle cx="1100" cy="500" r="120" fill="white" opacity="0.05"/>
  <circle cx="950" cy="80" r="50" fill="white" opacity="0.08"/>
  
  <!-- 메인 타이틀 -->
  <text x="600" y="110" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="800" fill="white" text-anchor="middle" letter-spacing="-1">
    Research Hypotheses
  </text>
  <text x="600" y="155" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="white" opacity="0.9" text-anchor="middle">
    Generative AI · Avatar · Healthcare · Education · Incubator
  </text>
  
  <!-- 카드 1: Avatar Trust -->
  <g transform="translate(80, 220)" filter="url(#shadow)">
    <rect width="240" height="320" rx="20" fill="url(#card1)"/>
    <circle cx="120" cy="80" r="38" fill="white" opacity="0.9"/>
    <circle cx="108" cy="72" r="5" fill="#4facfe"/>
    <circle cx="132" cy="72" r="5" fill="#4facfe"/>
    <path d="M 100 95 Q 120 108 140 95" stroke="#4facfe" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="120" y="180" font-family="sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">01. Avatar</text>
    <text x="120" y="208" font-family="sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">&amp; Trust</text>
    <text x="120" y="248" font-family="sans-serif" font-size="14" fill="white" opacity="0.9" text-anchor="middle">H1 · H2 · H3 · H4</text>
    <text x="120" y="280" font-family="sans-serif" font-size="13" fill="white" opacity="0.8" text-anchor="middle">4 hypotheses</text>
  </g>
  
  <!-- 카드 2: Healthcare -->
  <g transform="translate(360, 220)" filter="url(#shadow)">
    <rect width="240" height="320" rx="20" fill="url(#card2)"/>
    <!-- 하트+펄스 아이콘 -->
    <path d="M 120 60 C 100 40, 70 50, 70 80 C 70 105, 120 130, 120 130 C 120 130, 170 105, 170 80 C 170 50, 140 40, 120 60 Z" fill="white" opacity="0.9"/>
    <path d="M 80 95 L 95 95 L 105 80 L 115 110 L 125 95 L 160 95" stroke="#43e97b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="180" font-family="sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">02. Health</text>
    <text x="120" y="208" font-family="sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">&amp; Behavior</text>
    <text x="120" y="248" font-family="sans-serif" font-size="14" fill="white" opacity="0.9" text-anchor="middle">H5 · H6 · H7</text>
    <text x="120" y="280" font-family="sans-serif" font-size="13" fill="white" opacity="0.8" text-anchor="middle">3 hypotheses</text>
  </g>
  
  <!-- 카드 3: Education -->
  <g transform="translate(640, 220)" filter="url(#shadow)">
    <rect width="240" height="320" rx="20" fill="url(#card3)"/>
    <!-- 책 아이콘 -->
    <path d="M 70 60 L 70 120 L 120 105 L 170 120 L 170 60 L 120 75 Z" fill="white" opacity="0.9"/>
    <line x1="120" y1="75" x2="120" y2="105" stroke="#fa709a" stroke-width="2"/>
    <!-- 별 -->
    <path d="M 145 45 L 148 53 L 156 53 L 150 58 L 152 66 L 145 61 L 138 66 L 140 58 L 134 53 L 142 53 Z" fill="white" opacity="0.9"/>
    <text x="120" y="180" font-family="sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">03. Education</text>
    <text x="120" y="208" font-family="sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">&amp; Learning</text>
    <text x="120" y="248" font-family="sans-serif" font-size="14" fill="white" opacity="0.9" text-anchor="middle">H8 · H9 · H10</text>
    <text x="120" y="280" font-family="sans-serif" font-size="13" fill="white" opacity="0.8" text-anchor="middle">3 hypotheses</text>
  </g>
  
  <!-- 카드 4: Incubator -->
  <g transform="translate(920, 220)" filter="url(#shadow)">
    <rect width="200" height="320" rx="20" fill="url(#card4)"/>
    <!-- 전구 아이콘 -->
    <circle cx="100" cy="75" r="32" fill="white" opacity="0.9"/>
    <rect x="88" y="105" width="24" height="8" fill="white" opacity="0.9"/>
    <rect x="92" y="115" width="16" height="6" fill="white" opacity="0.9"/>
    <!-- 광선 -->
    <line x1="100" y1="30" x2="100" y2="38" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    <line x1="65" y1="75" x2="73" y2="75" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    <line x1="127" y1="75" x2="135" y2="75" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    <line x1="73" y1="48" x2="79" y2="54" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    <line x1="121" y1="54" x2="127" y2="48" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
    <text x="100" y="180" font-family="sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">04. Incubator</text>
    <text x="100" y="208" font-family="sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">Meta</text>
    <text x="100" y="248" font-family="sans-serif" font-size="14" fill="white" opacity="0.9" text-anchor="middle">H11 · H12 · H13</text>
    <text x="100" y="280" font-family="sans-serif" font-size="13" fill="white" opacity="0.8" text-anchor="middle">3 hypotheses</text>
  </g>
  
  <!-- 하단 텍스트 -->
  <text x="600" y="580" font-family="sans-serif" font-size="14" fill="white" opacity="0.7" text-anchor="middle">
    13 Research Hypotheses · Park Lab · 2026
  </text>
</svg>
