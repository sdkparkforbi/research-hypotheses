<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#f093fb"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#0d8a6a"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#b85f42"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="100%" stop-color="#2c5fc7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="20" fill="url(#bg)"/>
  
  <!-- 별 (Top 3 표시) -->
  <g transform="translate(750, 50)">
    <path d="M 0 -16 L 5 -5 L 17 -5 L 7 3 L 11 14 L 0 7 L -11 14 L -7 3 L -17 -5 L -5 -5 Z" fill="#ffd700"/>
  </g>
  
  <!-- GPT 카드 -->
  <g transform="translate(170, 165)">
    <rect x="-65" y="-50" width="130" height="100" rx="14" fill="url(#card1)"/>
    <text x="0" y="-10" font-family="sans-serif" font-size="24" font-weight="800" fill="white" text-anchor="middle">GPT-4</text>
    <text x="0" y="20" font-family="sans-serif" font-size="14" fill="white" opacity="0.9" text-anchor="middle">⭐⭐⭐⭐⭐</text>
    <text x="0" y="42" font-family="sans-serif" font-size="11" fill="white" opacity="0.85" text-anchor="middle">7.0 / 7.0</text>
  </g>
  
  <!-- Claude 카드 -->
  <g transform="translate(400, 165)">
    <rect x="-65" y="-50" width="130" height="100" rx="14" fill="url(#card2)"/>
    <text x="0" y="-10" font-family="sans-serif" font-size="24" font-weight="800" fill="white" text-anchor="middle">Claude</text>
    <text x="0" y="20" font-family="sans-serif" font-size="14" fill="white" opacity="0.9" text-anchor="middle">⭐⭐⭐⭐⭐</text>
    <text x="0" y="42" font-family="sans-serif" font-size="11" fill="white" opacity="0.85" text-anchor="middle">6.8 / 7.0</text>
  </g>
  
  <!-- Gemma 카드 (낮은 평가) -->
  <g transform="translate(630, 165)">
    <rect x="-65" y="-50" width="130" height="100" rx="14" fill="#9a9a9a"/>
    <text x="0" y="-10" font-family="sans-serif" font-size="24" font-weight="800" fill="white" text-anchor="middle">Gemma</text>
    <text x="0" y="20" font-family="sans-serif" font-size="14" fill="white" opacity="0.9" text-anchor="middle">⭐⭐⭐</text>
    <text x="0" y="42" font-family="sans-serif" font-size="11" fill="white" opacity="0.85" text-anchor="middle">4.2 / 7.0</text>
  </g>
  
  <text x="400" y="55" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">H4 ⭐ Top 3</text>
  <text x="400" y="84" font-family="sans-serif" font-size="14" fill="white" opacity="0.9" text-anchor="middle">Same answer, different labels — does brand fool us?</text>
  <text x="400" y="280" font-family="sans-serif" font-size="15" font-weight="600" fill="white" opacity="0.95" text-anchor="middle">Brand Halo Effect on AI Trust</text>
</svg>
