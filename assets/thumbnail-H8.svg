<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="20" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="80" fill="white" opacity="0.08"/>
  
  <!-- 학생 -->
  <g transform="translate(170, 165)">
    <circle cx="0" cy="-15" r="32" fill="white"/>
    <circle cx="-10" cy="-20" r="4" fill="#fa709a"/>
    <circle cx="10" cy="-20" r="4" fill="#fa709a"/>
    <path d="M -10 -5 Q 0 3 10 -5" stroke="#fa709a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- 학사모 -->
    <path d="M -28 -28 L 0 -42 L 28 -28 L 0 -22 Z" fill="#2c3e50"/>
    <text x="0" y="40" font-family="sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Student</text>
  </g>
  
  <!-- 화살표 -->
  <path d="M 230 160 L 320 160" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <polygon points="320,160 310,154 310,166" fill="white" opacity="0.7"/>
  
  <!-- 통계봇 -->
  <g transform="translate(400, 165)">
    <rect x="-60" y="-55" width="120" height="100" rx="14" fill="white"/>
    <text x="0" y="-30" font-family="sans-serif" font-size="13" font-weight="700" fill="#fa709a" text-anchor="middle">📊 Stats Bot</text>
    <!-- 차트 -->
    <rect x="-40" y="0" width="12" height="30" fill="#fa709a"/>
    <rect x="-22" y="-10" width="12" height="40" fill="#fee140"/>
    <rect x="-4" y="-20" width="12" height="50" fill="#fa709a"/>
    <rect x="14" y="-15" width="12" height="45" fill="#fee140"/>
    <rect x="32" y="-5" width="8" height="35" fill="#fa709a"/>
  </g>
  
  <!-- 화살표 -->
  <path d="M 480 160 L 570 160" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <polygon points="570,160 560,154 560,166" fill="white" opacity="0.7"/>
  
  <!-- 결과 - 점수 상승 -->
  <g transform="translate(640, 165)">
    <rect x="-45" y="-40" width="90" height="80" rx="14" fill="white"/>
    <text x="0" y="-15" font-family="sans-serif" font-size="11" font-weight="600" fill="#fa709a" text-anchor="middle">Score</text>
    <text x="0" y="15" font-family="sans-serif" font-size="28" font-weight="800" fill="#fa709a" text-anchor="middle">A+</text>
    <text x="0" y="32" font-family="sans-serif" font-size="11" fill="#43e97b" text-anchor="middle">↑ 25%</text>
  </g>
  
  <text x="400" y="55" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">H8</text>
  <text x="400" y="278" font-family="sans-serif" font-size="15" fill="white" opacity="0.95" text-anchor="middle">LLM Tutor Bot &amp; Statistics Learning Outcomes</text>
</svg>
