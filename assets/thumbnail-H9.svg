<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="20" fill="url(#bg)"/>
  
  <!-- 소크라테스식 봇 -->
  <g transform="translate(200, 170)">
    <rect x="-100" y="-60" width="180" height="110" rx="14" fill="white"/>
    <circle cx="-70" cy="-30" r="15" fill="#fda085"/>
    <text x="-70" y="-26" font-family="sans-serif" font-size="14" font-weight="800" fill="white" text-anchor="middle">?</text>
    <text x="-45" y="-25" font-family="sans-serif" font-size="13" font-weight="700" fill="#fda085">왜 그렇게</text>
    <text x="-45" y="-10" font-family="sans-serif" font-size="13" font-weight="700" fill="#fda085">생각하세요?</text>
    <circle cx="-70" cy="10" r="15" fill="#fda085"/>
    <text x="-70" y="14" font-family="sans-serif" font-size="14" font-weight="800" fill="white" text-anchor="middle">?</text>
    <text x="-45" y="15" font-family="sans-serif" font-size="13" font-weight="700" fill="#fda085">한 단계 더</text>
    <text x="-45" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#fda085">생각해볼까요?</text>
    <text x="0" y="63" font-family="sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">Socratic</text>
  </g>
  
  <!-- vs -->
  <text x="400" y="170" font-family="sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle" opacity="0.6">vs</text>
  
  <!-- 직접 응답형 봇 -->
  <g transform="translate(600, 170)">
    <rect x="-100" y="-60" width="180" height="110" rx="14" fill="white"/>
    <circle cx="-70" cy="-25" r="15" fill="#f6d365"/>
    <text x="-70" y="-21" font-family="sans-serif" font-size="14" font-weight="800" fill="white" text-anchor="middle">!</text>
    <text x="-45" y="-20" font-family="sans-serif" font-size="13" font-weight="700" fill="#f6d365">정답은 42</text>
    <text x="-45" y="-5" font-family="sans-serif" font-size="13" font-weight="700" fill="#f6d365">입니다.</text>
    <text x="-45" y="15" font-family="sans-serif" font-size="11" fill="#666">이유는 X²이</text>
    <text x="-45" y="29" font-family="sans-serif" font-size="11" fill="#666">유의하기 때문</text>
    <text x="0" y="63" font-family="sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">Direct</text>
  </g>
  
  <text x="400" y="55" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">H9</text>
  <text x="400" y="85" font-family="sans-serif" font-size="14" fill="white" opacity="0.9" text-anchor="middle">Short-term Satisfaction vs Long-term Retention</text>
  <text x="400" y="280" font-family="sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.95" text-anchor="middle">Desirable Difficulty &amp; Generation Effect</text>
</svg>
