<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="20" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="80" fill="white" opacity="0.08"/>
  
  <!-- 폰 화면에 아바타 코치 -->
  <g transform="translate(180, 150)">
    <rect x="-50" y="-80" width="100" height="160" rx="14" fill="white"/>
    <rect x="-45" y="-72" width="90" height="120" rx="6" fill="#e8f9f0"/>
    <!-- 아바타 -->
    <circle cx="0" cy="-40" r="20" fill="#43e97b"/>
    <circle cx="-6" cy="-44" r="2" fill="white"/>
    <circle cx="6" cy="-44" r="2" fill="white"/>
    <path d="M -7 -35 Q 0 -30 7 -35" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- 운동 카운트 -->
    <text x="0" y="0" font-family="sans-serif" font-size="22" font-weight="800" fill="#43e97b" text-anchor="middle">15</text>
    <text x="0" y="16" font-family="sans-serif" font-size="8" fill="#666" text-anchor="middle">Squats!</text>
    <circle cx="0" cy="60" r="10" fill="#43e97b"/>
  </g>
  
  <!-- Retention 그래프 -->
  <g transform="translate(500, 165)">
    <line x1="-100" y1="50" x2="120" y2="50" stroke="white" stroke-width="2" opacity="0.4"/>
    <line x1="-100" y1="50" x2="-100" y2="-60" stroke="white" stroke-width="2" opacity="0.4"/>
    
    <!-- With Avatar (높음) -->
    <path d="M -100 -50 L -50 -35 L 0 -20 L 50 -10 L 100 -5" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="-100" cy="-50" r="5" fill="white"/>
    <circle cx="100" cy="-5" r="5" fill="white"/>
    
    <!-- Without Avatar (낮음) -->
    <path d="M -100 -50 L -50 -10 L 0 15 L 50 30 L 100 38" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.5" stroke-dasharray="6,4"/>
    
    <text x="-100" y="68" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" opacity="0.9">Day 1</text>
    <text x="100" y="68" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle" opacity="0.9">Day 30</text>
    <text x="120" y="-5" font-family="sans-serif" font-size="11" font-weight="600" fill="white">Avatar</text>
    <text x="120" y="42" font-family="sans-serif" font-size="11" fill="white" opacity="0.7">Control</text>
  </g>
  
  <text x="400" y="55" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">H5</text>
  <text x="400" y="278" font-family="sans-serif" font-size="15" fill="white" opacity="0.95" text-anchor="middle">Avatar Coach &amp; Exercise Retention (7d / 30d)</text>
</svg>
