<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c9ff"/>
      <stop offset="100%" stop-color="#92fe9d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="20" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="80" fill="white" opacity="0.08"/>
  
  <!-- 텍스트 봇 -->
  <g transform="translate(160, 160)">
    <rect x="-50" y="-40" width="100" height="70" rx="14" fill="white"/>
    <rect x="-40" y="-30" width="60" height="6" rx="3" fill="#00c9ff" opacity="0.5"/>
    <rect x="-40" y="-18" width="50" height="6" rx="3" fill="#00c9ff" opacity="0.5"/>
    <rect x="-40" y="-6" width="70" height="6" rx="3" fill="#00c9ff" opacity="0.5"/>
    <rect x="-40" y="6" width="40" height="6" rx="3" fill="#00c9ff" opacity="0.5"/>
    <path d="M -15 30 L -15 45 L 0 35 Z" fill="white"/>
    <text x="0" y="70" font-family="sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Text</text>
  </g>
  
  <!-- 음성 봇 -->
  <g transform="translate(400, 160)">
    <circle cx="0" cy="0" r="42" fill="white"/>
    <rect x="-6" y="-22" width="12" height="22" rx="6" fill="#00c9ff"/>
    <path d="M -18 0 Q -18 18 0 18 Q 18 18 18 0" stroke="#00c9ff" stroke-width="3" fill="none"/>
    <line x1="0" y1="18" x2="0" y2="28" stroke="#00c9ff" stroke-width="3"/>
    <text x="0" y="70" font-family="sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Voice</text>
  </g>
  
  <!-- 아바타 봇 -->
  <g transform="translate(640, 160)">
    <circle cx="0" cy="0" r="42" fill="white"/>
    <circle cx="-13" cy="-8" r="5" fill="#00c9ff"/>
    <circle cx="13" cy="-8" r="5" fill="#00c9ff"/>
    <path d="M -16 12 Q 0 22 16 12" stroke="#00c9ff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="0" y="70" font-family="sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Avatar</text>
  </g>
  
  <!-- 화살표 -->
  <path d="M 220 160 L 340 160" stroke="white" stroke-width="2" opacity="0.6" stroke-dasharray="5,3"/>
  <path d="M 460 160 L 580 160" stroke="white" stroke-width="2" opacity="0.6" stroke-dasharray="5,3"/>
  
  <text x="400" y="55" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">H3</text>
  <text x="400" y="275" font-family="sans-serif" font-size="15" fill="white" opacity="0.95" text-anchor="middle">Self-Disclosure · Text vs Voice vs Avatar</text>
</svg>
