<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#764ba2"/>
      <stop offset="100%" stop-color="#667eea"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="20" fill="url(#bg)"/>
  
  <!-- 별 -->
  <g transform="translate(750, 50)">
    <path d="M 0 -16 L 5 -5 L 17 -5 L 7 3 L 11 14 L 0 7 L -11 14 L -7 3 L -17 -5 L -5 -5 Z" fill="#ffd700"/>
  </g>
  
  <!-- Week 0 - 다양한 아이디어 -->
  <g transform="translate(180, 170)">
    <text x="0" y="-80" font-family="sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">Week 0</text>
    <text x="0" y="-62" font-family="sans-serif" font-size="11" fill="white" opacity="0.85" text-anchor="middle">Diverse Ideas</text>
    
    <!-- 다양한 색·모양의 아이디어 -->
    <circle cx="-30" cy="-30" r="13" fill="#ff6b9d"/>
    <rect x="5" y="-43" width="26" height="26" rx="4" fill="#ffd700"/>
    <polygon points="35,5 50,30 20,30" fill="#43e97b"/>
    <circle cx="-15" cy="20" r="14" fill="#4facfe"/>
    <rect x="20" y="40" width="22" height="22" rx="11" fill="#ff9a9e"/>
    <polygon points="-40,10 -28,30 -52,30" fill="#fee140"/>
  </g>
  
  <!-- 화살표 -->
  <g transform="translate(400, 170)">
    <path d="M -60 0 L 60 0" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <polygon points="60,0 50,-6 50,6" fill="white"/>
    <text x="0" y="-15" font-family="sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">6 weeks</text>
    <text x="0" y="20" font-family="sans-serif" font-size="11" fill="white" opacity="0.85" text-anchor="middle">AI Incubator</text>
  </g>
  
  <!-- Week 6 - 비슷한 아이디어 -->
  <g transform="translate(620, 170)">
    <text x="0" y="-80" font-family="sans-serif" font-size="13" font-weight="700" fill="white" text-anchor="middle">Week 6</text>
    <text x="0" y="-62" font-family="sans-serif" font-size="11" fill="white" opacity="0.85" text-anchor="middle">Homogenized</text>
    
    <!-- 모두 비슷한 모양 -->
    <circle cx="-30" cy="-30" r="13" fill="#a8a8e0"/>
    <circle cx="0" cy="-30" r="13" fill="#a8a8e0"/>
    <circle cx="30" cy="-30" r="13" fill="#a8a8e0"/>
    <circle cx="-30" cy="0" r="13" fill="#a8a8e0"/>
    <circle cx="0" cy="0" r="13" fill="#a8a8e0"/>
    <circle cx="30" cy="0" r="13" fill="#a8a8e0"/>
    <circle cx="-15" cy="30" r="13" fill="#a8a8e0"/>
    <circle cx="15" cy="30" r="13" fill="#a8a8e0"/>
  </g>
  
  <text x="400" y="55" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">H12 ⭐ Top 3</text>
  <text x="400" y="84" font-family="sans-serif" font-size="14" fill="white" opacity="0.95" text-anchor="middle">Does AI expand creativity — or shrink it?</text>
  <text x="400" y="280" font-family="sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.95" text-anchor="middle">Originality ↓ vs Feasibility ↑ Trade-off</text>
</svg>
