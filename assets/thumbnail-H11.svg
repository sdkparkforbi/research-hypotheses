<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1"/>
      <stop offset="100%" stop-color="#fbc2eb"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="20" fill="url(#bg)"/>
  
  <!-- 학생 팀 -->
  <g transform="translate(160, 165)">
    <circle cx="-20" cy="-10" r="15" fill="white"/>
    <circle cx="0" cy="-15" r="15" fill="white"/>
    <circle cx="20" cy="-10" r="15" fill="white"/>
    <rect x="-35" y="5" width="70" height="25" rx="6" fill="white" opacity="0.9"/>
    <text x="0" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#a18cd1" text-anchor="middle">Student Team</text>
  </g>
  
  <!-- 화살표 -->
  <path d="M 220 165 L 290 165" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <polygon points="290,165 280,159 280,171" fill="white" opacity="0.7"/>
  
  <!-- 인프라 박스 (3개 패키지) -->
  <g transform="translate(400, 165)">
    <rect x="-90" y="-65" width="180" height="130" rx="14" fill="white"/>
    <text x="0" y="-45" font-family="sans-serif" font-size="13" font-weight="800" fill="#a18cd1" text-anchor="middle">🎁 Bootstrap Kit</text>
    
    <!-- 아이템 1 -->
    <circle cx="-65" cy="-15" r="10" fill="#a18cd1"/>
    <text x="-65" y="-11" font-family="sans-serif" font-size="11" font-weight="800" fill="white" text-anchor="middle">$</text>
    <text x="-25" y="-11" font-family="sans-serif" font-size="11" fill="#333">Claude $100</text>
    
    <!-- 아이템 2 -->
    <circle cx="-65" cy="10" r="10" fill="#a18cd1"/>
    <text x="-65" y="14" font-family="sans-serif" font-size="11" font-weight="800" fill="white" text-anchor="middle">🤖</text>
    <text x="-25" y="14" font-family="sans-serif" font-size="11" fill="#333">Bot Starter</text>
    
    <!-- 아이템 3 -->
    <circle cx="-65" cy="35" r="10" fill="#a18cd1"/>
    <text x="-65" y="39" font-family="sans-serif" font-size="11" font-weight="800" fill="white" text-anchor="middle">{ }</text>
    <text x="-25" y="39" font-family="sans-serif" font-size="11" fill="#333">Baseline Code</text>
  </g>
  
  <!-- 화살표 -->
  <path d="M 510 165 L 580 165" stroke="white" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
  <polygon points="580,165 570,159 570,171" fill="white" opacity="0.7"/>
  
  <!-- MVP 결과 -->
  <g transform="translate(660, 165)">
    <rect x="-50" y="-50" width="100" height="100" rx="14" fill="white"/>
    <text x="0" y="-25" font-family="sans-serif" font-size="11" font-weight="700" fill="#a18cd1" text-anchor="middle">MVP</text>
    <text x="0" y="5" font-family="sans-serif" font-size="32" font-weight="800" fill="#43e97b" text-anchor="middle">✓</text>
    <text x="0" y="30" font-family="sans-serif" font-size="11" font-weight="600" fill="#666" text-anchor="middle">6 weeks</text>
  </g>
  
  <text x="400" y="55" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">H11</text>
  <text x="400" y="84" font-family="sans-serif" font-size="14" fill="white" opacity="0.95" text-anchor="middle">AI Bootstrap Infra → MVP Completion · Cluster RCT</text>
  <text x="400" y="280" font-family="sans-serif" font-size="13" font-weight="600" fill="white" opacity="0.9" text-anchor="middle">CRMMP-linked Study</text>
</svg>
