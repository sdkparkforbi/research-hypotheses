<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee7df"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="20" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="80" fill="white" opacity="0.08"/>
  
  <!-- 눈 (시선) -->
  <g transform="translate(180, 160)">
    <ellipse cx="0" cy="0" rx="55" ry="32" fill="white"/>
    <circle cx="0" cy="0" r="20" fill="#4a4a4a"/>
    <circle cx="0" cy="0" r="10" fill="#1a1a1a"/>
    <circle cx="-5" cy="-5" r="3" fill="white"/>
    <text x="0" y="65" font-family="sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Gaze</text>
    <text x="0" y="82" font-family="sans-serif" font-size="11" fill="white" opacity="0.85" text-anchor="middle">시선</text>
  </g>
  
  <!-- 표정 (스마일) -->
  <g transform="translate(400, 160)">
    <circle cx="0" cy="0" r="42" fill="#ffd86b"/>
    <circle cx="-13" cy="-8" r="4" fill="#1a1a1a"/>
