    <path d="M -18 8 Q 0 22 18 8" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="0" y="65" font-family="sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Expression</text>
    <text x="0" y="82" font-family="sans-serif" font-size="11" fill="white" opacity="0.85" text-anchor="middle">표정</text>
  </g>
  
  <!-- 말투 (음파) -->
  <g transform="translate(620, 160)">
    <rect x="-32" y="-4" width="6" height="8" rx="2" fill="white"/>
    <rect x="-22" y="-12" width="6" height="24" rx="2" fill="white"/>
    <rect x="-12" y="-20" width="6" height="40" rx="2" fill="white"/>
    <rect x="-2" y="-26" width="6" height="52" rx="2" fill="white"/>
    <rect x="8" y="-20" width="6" height="40" rx="2" fill="white"/>
    <rect x="18" y="-12" width="6" height="24" rx="2" fill="white"/>
    <rect x="28" y="-4" width="6" height="8" rx="2" fill="white"/>
