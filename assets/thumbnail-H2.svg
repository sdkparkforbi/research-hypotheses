  <text x="400" y="55" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">H2</text>
  <text x="400" y="275" font-family="sans-serif" font-size="15" fill="white" opacity="0.9" text-anchor="middle">2×2×2 Factorial Design · Decomposing Trust Cues</text>
