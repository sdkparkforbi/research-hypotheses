<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#fee140"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="20" fill="url(#bg)"/>
  
  <!-- 별 -->
  <g transform="translate(750, 50)">
    <path d="M 0 -16 L 5 -5 L 17 -5 L 7 3 L 11 14 L 0 7 L -11 14 L -7 3 L -17 -5 L -5 -5 Z" fill="#ffd700"/>
  </g>
  
  <!-- 젊은 층 + 유사형 아바타 -->
  <g transform="translate(220, 170)">
    <rect x="-90" y="-60" width="180" height="120" rx="14" fill="white" opacity="0.95"/>
    <!-- 젊은 사용자 -->
    <circle cx="-50" cy="-15" r="22" fill="#fa709a"/>
    <circle cx="-56" cy="-19" r="3" fill="white"/>
    <circle cx="-44" cy="-19" r="3" fill="white"/>
    <path d="M -56 -8 Q -50 -3 -44 -8" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="-50" y="25" font-family="sans-serif" font-size="10" fill="#fa709a" font-weight="700" text-anchor="middle">YOU 20s</text>
    
    <text x="0" y="0" font-family="sans-serif" font-size="20" fill="#fa709a" text-anchor="middle" font-weight="800">↔</text>
    
    <!-- 유사형 코치 -->
    <circle cx="50" cy="-15" r="22" fill="#fa709a"/>
    <circle cx="44" cy="-19" r="3" fill="white"/>
    <circle cx="56" cy="-19" r="3" fill="white"/>
    <path d="M 44 -8 Q 50 -3 56 -8" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="50" y="25" font-family="sans-serif" font-size="10" fill="#fa709a" font-weight="700" text-anchor="middle">COACH 20s</text>
    
    <text x="0" y="48" font-family="sans-serif" font-size="11" fill="#fa709a" font-weight="700" text-anchor="middle">Similarity Wins ✓</text>
  </g>
  
  <!-- 고령층 + 권위형 아바타 -->
  <g transform="translate(580, 170)">
    <rect x="-90" y="-60" width="180" height="120" rx="14" fill="white" opacity="0.95"/>
    <!-- 노인 사용자 -->
    <circle cx="-50" cy="-15" r="22" fill="#b88560"/>
    <circle cx="-56" cy="-19" r="3" fill="white"/>
    <circle cx="-44" cy="-19" r="3" fill="white"/>
    <path d="M -56 -8 Q -50 -3 -44 -8" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 흰머리 -->
    <path d="M -65 -30 Q -50 -38 -35 -30" stroke="white" stroke-width="3" fill="none"/>
    <text x="-50" y="25" font-family="sans-serif" font-size="10" fill="#b88560" font-weight="700" text-anchor="middle">YOU 60s</text>
    
    <text x="0" y="0" font-family="sans-serif" font-size="20" fill="#b88560" text-anchor="middle" font-weight="800">↔</text>
    
    <!-- 권위형 코치 -->
    <circle cx="50" cy="-15" r="22" fill="#2c3e50"/>
    <circle cx="44" cy="-19" r="3" fill="white"/>
    <circle cx="56" cy="-19" r="3" fill="white"/>
    <path d="M 44 -7 Q 50 -3 56 -7" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 안경 -->
    <circle cx="44" cy="-19" r="6" stroke="white" stroke-width="1.5" fill="none"/>
    <circle cx="56" cy="-19" r="6" stroke="white" stroke-width="1.5" fill="none"/>
    <text x="50" y="25" font-family="sans-serif" font-size="10" fill="#2c3e50" font-weight="700" text-anchor="middle">EXPERT</text>
    
    <text x="0" y="48" font-family="sans-serif" font-size="11" fill="#2c3e50" font-weight="700" text-anchor="middle">Authority Wins ✓</text>
  </g>
  
  <text x="400" y="55" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">H6 ⭐ Top 3</text>
  <text x="400" y="84" font-family="sans-serif" font-size="14" fill="white" opacity="0.95" text-anchor="middle">Avatar Type × Age — Interaction Effect</text>
  <text x="400" y="280" font-family="sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.95" text-anchor="middle">Similarity for Young · Authority for Old</text>
</svg>
