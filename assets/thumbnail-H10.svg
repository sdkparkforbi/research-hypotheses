<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e"/>
      <stop offset="100%" stop-color="#fad0c4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="20" fill="url(#bg)"/>
  
  <!-- 일반 봇 -->
  <g transform="translate(200, 165)">
    <rect x="-80" y="-60" width="160" height="120" rx="14" fill="white"/>
    <circle cx="0" cy="-25" r="22" fill="#a0a0a0"/>
    <circle cx="-7" cy="-30" r="3" fill="white"/>
    <circle cx="7" cy="-30" r="3" fill="white"/>
    <path d="M -8 -18 Q 0 -13 8 -18" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- 라벨 -->
    <rect x="-50" y="10" width="100" height="20" rx="10" fill="#dadada"/>
    <text x="0" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#666" text-anchor="middle">Generic Bot</text>
    
    <text x="0" y="50" font-family="sans-serif" font-size="11" fill="#888" text-anchor="middle">사용시간: 12분</text>
  </g>
  
  <!-- 화살표 (=) -->
  <text x="400" y="170" font-family="sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle" opacity="0.6">=</text>
  <text x="400" y="200" font-family="sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle" opacity="0.85">동일 봇</text>
  
  <!-- 맞춤형 봇 (같은 봇, 다른 라벨) -->
  <g transform="translate(600, 165)">
    <rect x="-80" y="-60" width="160" height="120" rx="14" fill="white"/>
    <circle cx="0" cy="-25" r="22" fill="#ff6b9d"/>
    <circle cx="-7" cy="-30" r="3" fill="white"/>
    <circle cx="7" cy="-30" r="3" fill="white"/>
    <path d="M -8 -18 Q 0 -13 8 -18" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 반짝임 -->
    <path d="M -25 -45 L -22 -39 L -16 -42 L -19 -36 L -16 -30 L -22 -33 L -28 -30 L -25 -36 L -28 -42 Z" fill="#fff200"/>
    <path d="M 22 -45 L 25 -39 L 31 -42 L 28 -36 L 31 -30 L 25 -33 L 19 -30 L 22 -36 L 19 -42 Z" fill="#fff200"/>
    
    <!-- 라벨 -->
    <rect x="-65" y="10" width="130" height="20" rx="10" fill="#ff6b9d"/>
    <text x="0" y="24" font-family="sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">✨ Your AI Tutor ✨</text>
    
    <text x="0" y="50" font-family="sans-serif" font-size="11" fill="#ff6b9d" font-weight="700" text-anchor="middle">사용시간: 18분 ↑</text>
  </g>
  
  <text x="400" y="55" font-family="-apple-system, sans-serif" font-size="32" font-weight="800" fill="white" text-anchor="middle">H10</text>
  <text x="400" y="85" font-family="sans-serif" font-size="14" fill="white" opacity="0.95" text-anchor="middle">Same Bot, Different Label · Placebo Effect</text>
  <text x="400" y="280" font-family="sans-serif" font-size="14" font-weight="600" fill="white" opacity="0.95" text-anchor="middle">Personalization Labeling on Engagement</text>
</svg>
